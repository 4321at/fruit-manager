                    <button type="submit" class="w-10 h-10 rounded-full bg-sage-800 text-white hover:bg-fresh-orange transition flex items-center justify-center">

<script>
        // 1. 初始化與頁面控制
        const now = new Date();
        const y = now.getFullYear();
        const m = now.getMonth() + 1;
        const d = now.getDate();
        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
        const dayName = weekDays[now.getDay()];

        // 設定為 2025/12/25 (四) 格式
        document.getElementById('current-date').textContent = `${y}/${m}/${d} (${dayName})`;

        function switchTab(tabId) {
            ['dashboard', 'inventory', 'marketing'].forEach(id => {
                document.getElementById(`view-${id}`).classList.add('hidden');
                document.getElementById(`nav-${id}`).classList.remove('bg-sage-800', 'text-white');
                document.getElementById(`nav-${id}`).classList.add('text-gray-300');
            });
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            const activeNav = document.getElementById(`nav-${tabId}`);
            activeNav.classList.add('bg-sage-800', 'text-white');
            activeNav.classList.remove('text-gray-300');
        }

        function toggleChat() {
            const chatWin = document.getElementById('chat-window');
            chatWin.classList.toggle('hidden');
        }
        
        // [新增] 處理情境標籤點擊效果
        function selectTag(btn) {
            // 1. 重置所有按鈕樣式
            const allBtns = document.querySelectorAll('#vibe-tags button');
            allBtns.forEach(b => {
                b.classList.remove('vibe-tag-active', 'bg-sage-800', 'text-white');
                b.classList.add('border-gray-200', 'text-gray-800');
            });

            // 2. 設定當前按鈕為啟用狀態
            btn.classList.remove('border-gray-200', 'text-gray-800');
            btn.classList.add('vibe-tag-active', 'bg-sage-800', 'text-white');
        }

        // 2. 獲取儀表板資料 (修正版)
// 2. 獲取儀表板資料 (修正版：先顯示測試選項，再讀取 API)
        async function fetchDashboardData() {
            // 先抓取選單元素
            const productSelect = document.getElementById('product-select');
         
            
            // 【關鍵修正】在呼叫 API 之前，先填入測試選項，這樣網頁一開就有東西選

            /*
                    <option value="測試用愛文芒果">【測試】愛文芒果</option>
                    <option value="測試用高山高麗菜">【測試】高山高麗菜</option>

            */
            if (productSelect) {
                productSelect.innerHTML = `
                    <option value="auto">自動推薦 (依天氣/庫存)</option>
                `;
            }

            if(N8N_DATA_API.includes("YOUR_N8N")) {
                console.warn("請設定 N8N Webhook 網址");
                return;
            }

            try {
                // 開始向 n8n 請求資料
                const res = await fetch(N8N_DATA_API);
                const data = await res.json();

                // 如果成功抓到真實庫存，則把真實資料加在測試選項後面
                if (productSelect && data.inventory && Array.isArray(data.inventory)) {
                    data.inventory.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item.name;
                        opt.textContent = `${item.name} (庫存: ${item.stock})`;
                        productSelect.appendChild(opt);
                    });
                }
               
                // --- 更新天氣 ---
                document.getElementById('weather-widget').innerHTML = `
                    <i class="fa-solid fa-cloud-sun text-fresh-orange mr-2"></i>
                    <span class="font-bold text-sage-800 mr-2">台北 ${Math.round(data.temp)}°C</span>
                    <span class="text-xs text-gray-500 border-l pl-2 border-gray-300">${data.weather}</span>
                `;

                // --- 更新庫存表格 ---
                const tbody = document.getElementById('inventory-table-body');
                if (tbody) tbody.innerHTML = '';
                const alertList = document.getElementById('alert-list');
                if (alertList) alertList.innerHTML = '';

                let urgentCount = 0;

                if (data.inventory && Array.isArray(data.inventory)) {
                    data.inventory.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50";
                        let badgeClass = "bg-green-100 text-green-700";
                        if(item.status === '急售') badgeClass = "bg-red-100 text-red-700";
                        if(item.status === '即期') badgeClass = "bg-yellow-100 text-yellow-700";

                        tr.innerHTML = `
                            <td class="p-4 font-bold text-gray-800">${item.name}</td>
                            <td class="p-4 font-mono">${item.stock}</td>
                            <td class="p-4"><span class="${badgeClass} px-2 py-1 rounded text-xs font-bold">${item.status}</span></td>
                            <td class="p-4 text-gray-600">${item.days_left} 天</td>
                        `;
                        if (tbody) tbody.appendChild(tr);

                        if(item.status === '急售' || item.status === '即期') {
                            urgentCount++;
                            const li = document.createElement('li');
                            li.className = `flex justify-between items-center p-3 ${item.status === '急售' ? 'bg-red-50' : 'bg-yellow-50'} rounded-lg`;
                            li.innerHTML = `
                                <div><span class="font-bold text-gray-700">${item.name}</span><div class="text-xs ${item.status === '急售' ? 'text-red-500' : 'text-yellow-600'}">剩餘 ${item.days_left} 天</div></div>
                                <span class="font-mono font-bold text-xl text-gray-800">${item.stock}</span>
                            `;
                            if (alertList) alertList.appendChild(li);
                        }
                    });
                }

                if(urgentCount === 0 && alertList) alertList.innerHTML = '<li class="text-green-600 text-sm p-2">目前無急售商品，庫存健康！</li>';
                const aiInsight = document.getElementById('ai-insight-text');
                if (aiInsight) aiInsight.innerText = `目前有 ${urgentCount} 項商品需要注意效期。今日天氣 ${data.weather}，建議檢查上方急售清單進行促銷。`;

            } catch (error) {
                console.error("Fetch Data Error:", error);
                const aiInsight = document.getElementById('ai-insight-text');
                if (aiInsight) aiInsight.innerText = "無法連線至系統，請確認 n8n 是否啟動。目前僅能使用測試選單。";
            }
        }
        // 3. AI 對話功能
        async function sendChat(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';
            
            const loadingId = addMessage('思考中...', 'ai', true);

            try {
                const res = await fetch(N8N_CHAT_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatInput: message })
                });
                const data = await res.json();
                document.getElementById(loadingId).remove();
                addMessage(data.reply, 'ai');
            } catch (error) {
                document.getElementById(loadingId).remove();
                addMessage("連線錯誤，請稍後再試。", 'ai');
            }
        }

        function addMessage(text, sender, isLoading = false) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            const id = 'msg-' + Date.now();
            div.id = id;
            div.className = `flex gap-3 ${sender === 'user' ? 'justify-end' : ''}`;
            
            const icon = sender === 'ai' 
                ? `<div class="w-8 h-8 rounded-full bg-sage-200 flex items-center justify-center text-sage-700"><i class="fa-solid fa-robot"></i></div>`
                : '';
            
            const bubbleClass = sender === 'user' 
                ? 'bg-sage-600 text-white rounded-l-xl rounded-br-xl' 
                : 'bg-white text-gray-800 rounded-r-xl rounded-bl-xl border border-gray-100';

            div.innerHTML = `
                ${sender === 'ai' ? icon : ''}
                <div class="${bubbleClass} p-3 shadow-sm text-sm max-w-[80%]">
                    ${text} ${isLoading ? '<i class="fa-solid fa-spinner fa-spin ml-1"></i>' : ''}
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        // 4. 文案生成功能
        async function generateMarketingCopy() {
            const product = document.getElementById('product-select').value;
            const instruction = document.getElementById('custom-instruction').value;
            // 抓取被選中的標籤文字，若無則預設"一般"
            const vibe = document.querySelector('.vibe-tag-active')?.innerText || "一般";

            const btn = document.getElementById('generate-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>生成中...';

            try {
                // 呼叫您設定的行銷 Webhook
                const res = await fetch(N8N_MARKETING_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        product: product, 
                        vibe: vibe, 
                        instruction: instruction 
                    })
                });
                const data = await res.json();
                
                // 更新預覽區
                document.getElementById('copy-preview').innerText = data.copy;
                document.getElementById('publish-btns').classList.remove('opacity-50');
                document.querySelectorAll('.publish-btn').forEach(b => b.disabled = false);
            } catch (e) {
                console.error(e);
                alert("生成失敗，請檢查網路或 n8n 設定");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles mr-2"></i> AI 生成文案';
            }
        }

        // [新增] 統一發布函式
        async function publishContent(platform) {
            // 1. 抓取預覽區的文案
            const text = document.getElementById('copy-preview').innerText;
            if (!text || text.includes("尚未生成文案")) {
                alert("請先生成文案再發布！");
                return;
            }

            const confirmMsg = platform === 'fb' ? "確定要發布到 Facebook 粉絲專頁嗎？" : "確定要推播給老闆 (LINE) 嗎？";
            if (!confirm(confirmMsg)) return;

            // 2. 決定 API 網址
            const apiUrl = platform === 'fb' ? N8N_PUBLISH_FB_API : N8N_PUBLISH_LINE_API;
            
            // 3. UI 鎖定
            const btn = event.currentTarget; // 獲取點擊的按鈕
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i>發送中...`;

            try {
                // 4. 發送 POST 請求給 n8n
                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text }) // 將文案包在 text 欄位傳送
                });

                const result = await res.json();
                
                if (result.success) {
                    alert(`✅ ${platform === 'fb' ? 'Facebook' : 'LINE'} 發布成功！`);
                } else {
                    alert("❌ 發布失敗，請檢查 n8n 設定。");
                }

            } catch (e) {
                console.error(e);
                alert("連線錯誤，請確認 n8n 工作流已開啟 (Active)。");
            } finally {
                // 5. 恢復按鈕狀態
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // 頁面載入時自動抓取資料
        window.onload = fetchDashboardData;
    </script>
</body>
</html>
